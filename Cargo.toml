[package]
name = "agent-logs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Collect Codex and Claude Code sessions from every machine into one Postgres database, then find and resume them from a terminal picker"
default-run = "agent-resume"

[lib]
name = "agent_logs"
path = "src/lib.rs"

[[bin]]
name = "agent-resume"
path = "src/main.rs"

[[bin]]
name = "agent-logs"
path = "src/bin/agent-logs.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
flate2 = "1.1"
hostname = "0.4"
nucleo-matcher = "0.3.1"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde_json = "1.0"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
    "ring",
] }
webpki-roots = "1.0"

[profile.release]
lto = "thin"
strip = true
